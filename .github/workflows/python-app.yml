# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
     #- name: Lint with flake8
     # run: |
        # stop the build if there are Python syntax errors or undefined names
     #   flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
     #   flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
     #- name: Setup and Run Ollama
     # uses: imitrichev/ollama-action@v3
     # with:
     #   model: 'qwen3.5:0.8b'
    - name: Download and extract Ollama manually
      run: |
        # Приводим архитектуру к формату amd64 / arm64
        if [ "${{ runner.arch }}" = "X64" ]; then ARCH="amd64"; else ARCH="arm64"; fi
        
        # Скачивание и распаковка
        curl -fsSL "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" -o ollama.tar.zst
        mkdir -p .ollama-install
        tar -C .ollama-install --zstd -xf ollama.tar.zst
        rm ollama.tar.zst
        
        # Опционально: добавляем бинарник в PATH, чтобы команда `ollama` была доступна
        echo "$(pwd)/.ollama-install/bin" >> $GITHUB_PATH

    - name: Start Ollama Service and Pull Model
      run: |
        export OLLAMA_NUM_PARALLEL=1
        export OLLAMA_MAX_LOADED_MODELS=1
        
        # Запускаем Ollama в фоновом режиме и перенаправляем логи
        ollama serve > ollama.log 2>&1 &
    
        # Ждем пару секунд, пока сервер инициализируется
        sleep 5
    
        # Скачиваем модель, указанную в коде теста
        ollama pull qwen3.5:0.8b
        
    - name: Test with pytest
      working-directory: ./3_1_LLM_agent
      env:
        PYTHONPATH: .
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m pytest -v -m "not integration" --cov=llm_agent --cov-report=term-missing --cov-report=xml:coverage.xml
        python main.py

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./3_1_LLM_agent/coverage.xml
        fail_ci_if_error: true
        use_oidc: true
